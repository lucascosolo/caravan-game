# Caravan Vaults CI (chunk 21; final review N1). Runs on every push and pull request.
#
# The job is EXACTLY `pnpm check` (scripts/check.mjs: typecheck, lint, test:boundary, test,
# determinism, perf:resolver, build, migrate, smoke, e2e, e2e:hosting) plus what a fresh runner
# needs first: the Postgres 16 service, pnpm and Node, the frozen install and Playwright's Chromium.
# Anything that passes `pnpm check` locally passes here. The smoke run and both e2e runs connect as
# caravan_app, the role the shipped server runs as (final review N8).
#
# A staging deploy step is deliberately absent: the play test is hosted by hand from
# docs/PLAYTEST-HOSTING.md. When a hosting target is chosen, add a second job that needs `ci` and
# runs on pushes to main only.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEST_DATABASE_URL: postgres://caravan:caravan@localhost:5432/caravan_test
  # The determinism gate diffs the golden corpus against this on pushes (PRs use GITHUB_BASE_REF).
  DETERMINISM_BASE_SHA: ${{ github.event.before }}

jobs:
  ci:
    name: pnpm check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: caravan
          POSTGRES_PASSWORD: caravan
          POSTGRES_DB: caravan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caravan -d caravan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history so the determinism gate can compute a merge-base for golden-log diffs.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        # Version comes from the root package.json "packageManager" field.

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (the e2e steps of pnpm check)
        run: pnpm --filter @caravan/web exec playwright install --with-deps chromium

      - name: pnpm check
        run: pnpm check

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: server-dist-${{ github.sha }}
          path: apps/server/dist
          retention-days: 7
          if-no-files-found: error
